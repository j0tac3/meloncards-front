<div class="relative w-full h-full mx-auto p-1.5 sm:p-2 rounded-xl bg-white/40 dark:bg-slate-800/40 backdrop-blur-xl border-[2px] sm:border-[3px] border-white/60 dark:border-slate-600/50 shadow-[0_15px_30px_-10px_rgba(0,0,0,0.5)] ring-1 ring-slate-900/5 flex flex-col gap-1.5 sm:gap-2 transition-transform duration-300 hover:-translate-y-1 hover:shadow-2xl">
  
  <div class="absolute inset-0 rounded-lg bg-gradient-to-tr from-white/0 via-white/20 to-white/0 pointer-events-none z-50"></div>

  <div class="relative bg-gradient-to-b from-blue-700 to-blue-900 rounded-t-lg rounded-b-sm p-1 shadow-inner flex flex-col flex-shrink-0">
    
    <div class="text-center w-full pb-0.5 px-1">
      <span class="text-[8px] sm:text-[10px] font-black text-white tracking-wide uppercase truncate block w-full" [title]="cardName()">
        {{ cardName() }}
      </span>
    </div>

    <div class="bg-white rounded-sm flex items-center p-1 gap-1.5 shadow-sm min-h-[45px] sm:min-h-[55px] w-full">
      
      <div class="flex flex-col items-center justify-center w-10 sm:w-12 flex-shrink-0 border border-slate-300 rounded px-1 py-0.5 bg-slate-50">
        <span class="text-[5px] sm:text-[7px] font-bold text-slate-800 uppercase tracking-tighter text-center leading-none mb-0.5">{{ gradeText() }}</span>
        <span class="text-lg sm:text-xl font-black text-slate-900 leading-none">{{ grade() }}</span>
      </div>

      <div class="flex flex-col justify-center flex-1 min-w-0 text-left px-0.5">
        <span class="text-[8px] sm:text-[10px] font-black text-slate-900 leading-tight truncate w-full uppercase">
          {{ cardCategory() }}
          @if (cardRarity()) {
            <span class="text-slate-300 font-normal mx-0.5">/</span> <span class="text-indigo-600">{{ cardRarity() }}</span>
          }
        </span>
        <span class="text-[6px] sm:text-[7px] font-bold text-slate-500 uppercase tracking-wider">One Piece TCG</span>
        <span class="text-[7px] sm:text-[9px] font-black text-slate-700 leading-none mt-1">{{ cardSet() }}</span>
      </div>

      <div class="grid grid-cols-2 gap-x-1 gap-y-1 content-center w-14 sm:w-16 flex-shrink-0">
        <div class="flex flex-col items-center">
          <span class="text-[4px] sm:text-[5px] uppercase font-bold text-slate-500 leading-none">Cost</span>
          <span class="text-[6px] sm:text-[8px] font-black text-slate-900 leading-none">{{ cardCost() }}</span>
        </div>
        <div class="flex flex-col items-center">
          <span class="text-[4px] sm:text-[5px] uppercase font-bold text-slate-500 leading-none">Power</span>
          <span class="text-[6px] sm:text-[8px] font-black text-slate-900 leading-none">{{ cardPower() }}</span>
        </div>
        <div class="flex flex-col items-center">
          <span class="text-[4px] sm:text-[5px] uppercase font-bold text-slate-500 leading-none">Attr</span>
          <span class="text-[6px] sm:text-[8px] font-black text-slate-900 leading-none truncate w-full text-center" [title]="cardAttribute()">{{ cardAttribute() }}</span>
        </div>
        <div class="flex flex-col items-center">
          <span class="text-[4px] sm:text-[5px] uppercase font-bold text-slate-500 leading-none">Color</span>
          <span class="text-[6px] sm:text-[8px] font-black text-slate-900 leading-none truncate w-full text-center" [title]="cardColor()">{{ cardColor() }}</span>
        </div>
      </div>

    </div>
  </div>

  <div class="relative bg-black/5 dark:bg-black/40 rounded-lg p-1 sm:p-1.5 shadow-inner border border-slate-300/30 dark:border-slate-800 flex items-center justify-center flex-1">
    <div class="relative w-full h-full aspect-[2.5/3.5] bg-transparent rounded border border-white/20 dark:border-white/5 p-0.5 sm:p-1 shadow-[inset_0_4px_6px_rgba(0,0,0,0.1)] overflow-hidden">
      <img
        [src]="imageUrl()"
        [alt]="cardName()"
        class="w-full h-full object-contain drop-shadow-[0_4px_12px_rgba(0,0,0,0.4)]"
        loading="lazy"
      >
      <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/10 to-transparent pointer-events-none mix-blend-overlay"></div>
    </div>
  </div>

</div>
