<div class="group flex flex-col h-full bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 transition-all duration-300 md:hover:shadow-2xl md:hover:-translate-y-1 md:hover:scale-[1.02] overflow-hidden">

  <div class="relative w-full aspect-[2.5/3.5] cursor-pointer bg-slate-100 dark:bg-black/20"
       (click)="addClick.emit()">
    
    <img
      [src]="imageUrl()"
      [alt]="cardName()"
      referrerpolicy="no-referrer"
      class="w-full h-full object-contain"
      loading="lazy"
    >
    <div class="holo-glare absolute inset-0 z-10 pointer-events-none"></div>
  </div>

  <div class="flex-shrink-0 flex flex-col gap-3 p-3.5 z-20 border-t border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-900"
       (click)="$event.stopPropagation()">

    <div class="flex justify-between items-center">
      
      <span class="font-mono font-bold text-[11.5px] tracking-wider text-slate-500 dark:text-slate-400">
        {{ card().card_number }}
      </span>

      @if (card().quantity > 0) {
        <span class="flex items-center justify-center px-2 py-0.5 rounded-md text-[10px] font-extrabold bg-indigo-50 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300 border border-indigo-100/50 dark:border-indigo-500/20 shadow-sm">
          x{{ card().quantity }}
        </span>
      }
    </div>

    <div class="flex justify-between items-center">
      
      <div class="flex-1 truncate pr-2 flex items-center">
        @if (card().market_price !== null && card().market_price !== undefined) {
          <span class="block text-[15px] font-extrabold tracking-tight text-slate-900 dark:text-white leading-none translate-y-[1px]">
            {{ card().market_price | currency:'EUR':'symbol':'1.2-2':'es-ES' }}
          </span>
        } @else {
          <span class="block text-[0.75rem] italic text-slate-400 leading-none">
            Sin precio
          </span>
        }
      </div>

      <div class="flex items-center gap-2 flex-shrink-0 -mr-2">

        @if (isCollectionCard()) {
          <button (click)="onToggleFavorite($event)"
                  class="flex items-center justify-center w-[40px] h-[40px] rounded-full transition-colors duration-200 text-slate-400 dark:text-slate-500 md:hover:bg-slate-100 md:dark:hover:bg-slate-800 md:hover:text-red-500 focus:outline-none"
                  title="Favorito">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 class="w-[19px] h-[19px] transition-colors duration-300 {{ isFavorite() ? 'text-red-500 fill-red-500' : 'fill-none stroke-current stroke-[2.5]' }}">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
            </svg>
          </button>
        }

        @if (isAuthenticated()) {
          <button (click)="onToggleWishlist($event)"
                  class="flex items-center justify-center w-[40px] h-[40px] rounded-full transition-colors duration-200 text-slate-400 dark:text-slate-500 md:hover:bg-slate-100 md:dark:hover:bg-slate-800 md:hover:text-blue-500 focus:outline-none"
                  title="Lista de deseos">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 class="w-[19px] h-[19px] transition-colors duration-300 {{ isWishlisted() ? 'text-blue-500 fill-blue-500' : 'fill-none stroke-current stroke-[2.5]' }}">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" />
            </svg>
          </button>
        }
        
      </div>
    </div>
  </div>
</div>
